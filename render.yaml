services:
  - type: web
    name: food-calorie-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    # Render free tier timeout — max we can set
    autoDeploy: true
