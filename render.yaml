services:
  - type: web
    name: food-calorie-recogniation
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000} --timeout-keep-alive 75 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: PYTHONMALLOC
        value: "malloc"
    healthCheckPath: /health
    autoDeploy: true
